{% extends 'base.html' %}

{% block content %}

<h1>Update Book</h1>

<form method="POST">

<input type="text"
name="title"
value="{{ book.title }}"
required>

<input type="text"
name="author"
value="{{ book.author }}"
required>

<input type="text"
name="isbn"
value="{{ book.isbn }}"
required>

<input type="text"
name="category"
value="{{ book.category }}"
required>

<button type="submit">

Update Book

</button>

</form>

{% endblock %}
