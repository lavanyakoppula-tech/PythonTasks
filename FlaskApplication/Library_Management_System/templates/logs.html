{% extends 'base.html' %}

{% block content %}

<h1>Library Logs</h1>

<table>

<tr>

<th>Issue ID</th>
<th>Student ID</th>
<th>Book ID</th>
<th>Issued Date</th>
<th>Returned</th>

</tr>

{% for log in logs %}

<tr>

<td>{{ log.issue_id }}</td>

<td>{{ log.student_id }}</td>

<td>{{ log.book_id }}</td>

<td>{{ log.issued_date }}</td>

<td>{{ log.returned }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
